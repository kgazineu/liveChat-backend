name: livechat-back

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-livechat}
      POSTGRES_USER: ${POSTGRES_USER_NAME:-livechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASS_WORD:?defina POSTGRES_PASS_WORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:7880/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    image: ${APP_IMAGE:-livechat-back:local}
    build:
      context: .
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_NAME:-livechat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_NAME:-livechat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASS_WORD:?defina POSTGRES_PASS_WORD no arquivo .env}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_CLIENT_URL: ${LIVEKIT_CLIENT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LIVEKIT_TOKEN_TTL: ${LIVEKIT_TOKEN_TTL:-5m}
      LIVEKIT_ROOM_EMPTY_TIMEOUT: ${LIVEKIT_ROOM_EMPTY_TIMEOUT:-5m}
      LIVEKIT_ROOM_PROVISIONING_ENABLED: ${LIVEKIT_ROOM_PROVISIONING_ENABLED:-true}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8080/actuator/health | grep --quiet '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
