name: livechat-back

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-livechat}
      POSTGRES_USER: ${POSTGRES_USER_NAME:-livechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASS_WORD:?defina POSTGRES_PASS_WORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:7880/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    image: ${APP_IMAGE:-livechat-back:local}
    build:
      context: .
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_NAME:-livechat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_NAME:-livechat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASS_WORD:?defina POSTGRES_PASS_WORD no arquivo .env}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-5000}
      SMTP_READ_TIMEOUT_MS: ${SMTP_READ_TIMEOUT_MS:-5000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-5000}
      MAIL_FROM: ${MAIL_FROM:-no-reply@livechat.local}
      FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:-http://localhost:3000/password-reset}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-15m}
      FRONTEND_PROFILE_UPDATE_URL: ${FRONTEND_PROFILE_UPDATE_URL:-http://localhost:3000/profile-update}
      PROFILE_UPDATE_TOKEN_TTL: ${PROFILE_UPDATE_TOKEN_TTL:-15m}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LEGACY_DIRECT_MESSAGES_MIGRATION_ENABLED: ${LEGACY_DIRECT_MESSAGES_MIGRATION_ENABLED:-false}
      ATTACHMENTS_PENDING_TTL: ${ATTACHMENTS_PENDING_TTL:-15m}
      ATTACHMENTS_CLEANUP_INTERVAL: ${ATTACHMENTS_CLEANUP_INTERVAL:-60s}
      ATTACHMENTS_S3_INTERNAL_ENDPOINT: ${ATTACHMENTS_S3_INTERNAL_ENDPOINT:-http://host.docker.internal:9000}
      ATTACHMENTS_S3_PUBLIC_ENDPOINT: ${ATTACHMENTS_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      ATTACHMENTS_S3_REGION: ${ATTACHMENTS_S3_REGION:-us-east-1}
      ATTACHMENTS_S3_ACCESS_KEY: ${ATTACHMENTS_S3_ACCESS_KEY:-minioadmin}
      ATTACHMENTS_S3_SECRET_KEY: ${ATTACHMENTS_S3_SECRET_KEY:-minioadmin}
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET:-livechat-attachments}
      ATTACHMENTS_S3_PATH_STYLE: ${ATTACHMENTS_S3_PATH_STYLE:-true}
      ATTACHMENTS_UPLOAD_URL_TTL: ${ATTACHMENTS_UPLOAD_URL_TTL:-5m}
      ATTACHMENTS_DOWNLOAD_URL_TTL: ${ATTACHMENTS_DOWNLOAD_URL_TTL:-5m}
      TOMCAT_THREADS_MAX: ${TOMCAT_THREADS_MAX:-100}
      TOMCAT_MAX_CONNECTIONS: ${TOMCAT_MAX_CONNECTIONS:-1000}
      TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-100}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_CLIENT_URL: ${LIVEKIT_CLIENT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LIVEKIT_TOKEN_TTL: ${LIVEKIT_TOKEN_TTL:-5m}
      LIVEKIT_ROOM_EMPTY_TIMEOUT: ${LIVEKIT_ROOM_EMPTY_TIMEOUT:-5m}
      LIVEKIT_ROOM_PROVISIONING_ENABLED: ${LIVEKIT_ROOM_PROVISIONING_ENABLED:-true}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8080/actuator/health | grep --quiet '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
