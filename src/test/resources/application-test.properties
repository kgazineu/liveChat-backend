spring.application.name=liveChat-test
spring.datasource.url=jdbc:h2:mem:livechat;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.docker.compose.enabled=false
JWT_SECRET=test-only-secret-at-least-32-characters-long
livechat.media.reconnection-timeout=100ms
livechat.livekit.api-url=http://localhost:7880
livechat.livekit.client-url=ws://localhost:7880
livechat.livekit.api-key=test-livekit-key
livechat.livekit.api-secret=test-livekit-secret-at-least-32-characters-long
livechat.livekit.token-ttl=5m
livechat.livekit.room-provisioning-enabled=false
management.health.redis.enabled=false
