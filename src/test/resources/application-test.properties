spring.application.name=liveChat-test
spring.datasource.url=jdbc:h2:mem:livechat;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.docker.compose.enabled=false
JWT_SECRET=test-only-secret-at-least-32-characters-long
livechat.frontend.password-reset-url=http://frontend.test/password-reset
livechat.password-reset.token-ttl=15m
livechat.frontend.profile-update-url=http://frontend.test/profile-update
livechat.profile-update.token-ttl=15m
livechat.mail.from=no-reply@example.test
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
livechat.security.allowed-origins=http://frontend.test
livechat.migration.legacy-direct-messages.enabled=false
server.tomcat.threads.max=20
server.tomcat.max-connections=100
server.tomcat.accept-count=10
livechat.media.reconnection-timeout=100ms
livechat.livekit.api-url=http://localhost:7880
livechat.livekit.client-url=ws://localhost:7880
livechat.livekit.api-key=test-livekit-key
livechat.livekit.api-secret=test-livekit-secret-at-least-32-characters-long
livechat.livekit.token-ttl=5m
livechat.livekit.room-provisioning-enabled=false
management.health.redis.enabled=false
management.health.mail.enabled=false
