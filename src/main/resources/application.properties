spring.application.name=liveChat

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB_NAME}
spring.datasource.username=${POSTGRES_USER_NAME}
spring.datasource.password=${POSTGRES_PASS_WORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
livechat.mail.from=${MAIL_FROM:no-reply@livechat.local}
livechat.frontend.password-reset-url=${FRONTEND_PASSWORD_RESET_URL:http://localhost:3000/password-reset}
livechat.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:15m}
livechat.frontend.profile-update-url=${FRONTEND_PROFILE_UPDATE_URL:http://localhost:3000/profile-update}
livechat.profile-update.token-ttl=${PROFILE_UPDATE_TOKEN_TTL:15m}

# Sessões de mídia são efêmeras; uma desconexão inesperada recebe TTL de 30 segundos no Redis.
livechat.media.reconnection-timeout=30s
livechat.media.max-server-participants=5

# O backend usa a URL interna para provisionar salas e devolve somente a URL pública ao cliente.
livechat.livekit.api-url=${LIVEKIT_API_URL}
livechat.livekit.client-url=${LIVEKIT_CLIENT_URL}
livechat.livekit.api-key=${LIVEKIT_API_KEY}
livechat.livekit.api-secret=${LIVEKIT_API_SECRET}
livechat.livekit.token-ttl=${LIVEKIT_TOKEN_TTL:5m}
livechat.livekit.room-empty-timeout=${LIVEKIT_ROOM_EMPTY_TIMEOUT:5m}
livechat.livekit.room-provisioning-enabled=${LIVEKIT_ROOM_PROVISIONING_ENABLED:true}

spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# A documentação pública é exibida somente pelo Swagger UI em /docs.
# O endpoint dinâmico /v3/api-docs permanece bloqueado pela configuração de segurança.
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.query-config-enabled=false
