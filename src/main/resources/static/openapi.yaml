openapi: 3.0.3
info:
  title: LiveChat API
  version: 1.0.0
  description: >-
    API REST e contrato WebSocket/STOMP do LiveChat. Datas no formato
    date-time são representadas em UTC.
tags:
  - name: Usuários
    description: Cadastro, autenticação e gerenciamento da conta.
  - name: Amizades
    description: Solicitações e relacionamentos entre usuários.
  - name: Mensagens
    description: Histórico e entrega de mensagens de canais privados e de texto em servidores.
  - name: Canais privados
    description: Conversas privadas entre exatamente dois usuários.
  - name: Servidores
    description: Servidores, membros, canais e convites entre amigos.
  - name: WebSocket
    description: Handshake e protocolo STOMP de mensagens em tempo real.
  - name: Presença de mídia
    description: Participação efêmera em chamadas de voz, câmera e compartilhamento de tela.
  - name: Monitoramento
    description: Estado de saúde da aplicação e dependências.
paths:
  /users/register:
    post:
      tags: [Usuários]
      operationId: registerUser
      summary: Cadastra um usuário
      description: Cria uma conta e armazena a senha com BCrypt. Não inicia uma sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '200':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/login:
    post:
      tags: [Usuários]
      operationId: loginUser
      summary: Autentica um usuário
      description: Retorna um JWT de acesso válido por duas horas e um refresh token válido por sete dias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Credenciais válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/refresh:
    post:
      tags: [Usuários]
      operationId: refreshUserTokens
      summary: Renova os tokens
      description: Consome o refresh token atual e devolve um novo par. O token consumido não pode ser reutilizado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [Usuários]
      operationId: listUsers
      summary: Lista os usuários cadastrados
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuários encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}:
    delete:
      tags: [Usuários]
      operationId: deleteUser
      summary: Exclui a própria conta
      description: O identificador deve pertencer ao usuário autenticado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Conta excluída
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/search:
    get:
      tags: [Usuários]
      operationId: searchUsersByEmail
      summary: Busca um usuário por e-mail
      description: A implementação atual realiza correspondência exata de e-mail.
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: true
          description: E-mail completo do usuário procurado.
          schema:
            type: string
            format: email
          example: ana@example.com
      responses:
        '200':
          description: Lista vazia ou usuário encontrado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags: [Usuários]
      operationId: getCurrentUser
      summary: Obtém o usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados públicos da conta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /friendships/send:
    post:
      tags: [Amizades]
      operationId: sendFriendshipRequest
      summary: Envia uma solicitação de amizade
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendshipRequest'
      responses:
        '200':
          description: Solicitação enviada ou relacionamento rejeitado reaberto
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /friendships/{id}/accept:
    patch:
      tags: [Amizades]
      operationId: acceptFriendshipRequest
      summary: Aceita uma solicitação de amizade
      description: Somente o destinatário pode aceitar a solicitação.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FriendshipId'
      responses:
        '204':
          description: Solicitação aceita
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /friendships/{id}/reject:
    patch:
      tags: [Amizades]
      operationId: rejectFriendshipRequest
      summary: Rejeita uma solicitação de amizade
      description: Somente o destinatário pode rejeitar a solicitação.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FriendshipId'
      responses:
        '204':
          description: Solicitação rejeitada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /friendships:
    get:
      tags: [Amizades]
      operationId: listFriends
      summary: Lista os amigos do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Amigos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /friendships/requests:
    get:
      tags: [Amizades]
      operationId: listPendingFriendshipRequests
      summary: Lista solicitações de amizade pendentes
      description: Retorna solicitações recebidas pelo usuário autenticado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Solicitações pendentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendshipRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /direct-channels:
    post:
      tags: [Canais privados]
      operationId: createOrGetDirectChannel
      summary: Cria ou recupera um canal privado 1:1
      description: Há no máximo um canal para cada par de usuários, independentemente de qual deles inicia a conversa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectChannelRequest'
      responses:
        '201':
          description: Canal privado criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectChannel'
        '200':
          description: Canal privado já existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Canais privados]
      operationId: listDirectChannels
      summary: Lista os canais privados do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Canais privados encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /direct-channels/{channelId}:
    get:
      tags: [Canais privados]
      operationId: getDirectChannel
      summary: Consulta um canal privado
      description: Somente os dois participantes podem consultá-lo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      responses:
        '200':
          description: Canal privado encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /direct-channels/{channelId}/media-sessions:
    post:
      tags: [Presença de mídia]
      operationId: joinDirectChannelMediaSession
      summary: Entra na chamada privada 1:1
      description: Somente os participantes do canal podem entrar. Entrar encerra qualquer presença de mídia anterior do usuário.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      responses:
        '200':
          description: Presença de mídia ativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Presença de mídia]
      operationId: listDirectChannelMediaSessions
      summary: Lista os participantes da chamada privada 1:1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      responses:
        '200':
          description: Participantes ativos ou em reconexão
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Presença de mídia]
      operationId: leaveDirectChannelMediaSession
      summary: Sai da chamada privada 1:1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      responses:
        '204':
          description: Presença encerrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /direct-channels/{channelId}/media-sessions/me:
    patch:
      tags: [Presença de mídia]
      operationId: updateDirectChannelMediaState
      summary: Atualiza microfone, câmera ou tela na chamada privada
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaStateRequest'
      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /direct-channels/{channelId}/messages:
    post:
      tags: [Mensagens]
      operationId: sendDirectChannelMessage
      summary: Envia uma mensagem em um canal privado
      description: Somente um dos dois participantes do canal pode enviar mensagens.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '201':
          description: Mensagem enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Mensagens]
      operationId: listDirectChannelMessages
      summary: Lista as mensagens de um canal privado
      description: Somente os dois participantes do canal podem consultar o histórico.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      responses:
        '200':
          description: Mensagens encontradas em ordem cronológica
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /servers:
    post:
      tags: [Servidores]
      operationId: createServer
      summary: Cria um servidor
      description: O usuário autenticado se torna proprietário e primeiro membro do servidor.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Servidor criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Servidores]
      operationId: listServers
      summary: Lista os servidores do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Servidores encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /servers/{serverId}:
    get:
      tags: [Servidores]
      operationId: getServer
      summary: Consulta um servidor
      description: Exige que o usuário autenticado seja membro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Servidor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /servers/{serverId}/channels:
    post:
      tags: [Servidores]
      operationId: createServerChannel
      summary: Cria um canal de texto ou voz
      description: Somente o proprietário do servidor pode criar canais.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Canal criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Servidores]
      operationId: listServerChannels
      summary: Lista os canais de um servidor
      description: Exige que o usuário autenticado seja membro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Canais encontrados, ordenados pela posição de criação.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /servers/{serverId}/channels/{channelId}/media-sessions:
    post:
      tags: [Presença de mídia]
      operationId: joinServerVoiceChannelMediaSession
      summary: Entra em um canal de voz do servidor
      description: Exige participação no servidor e aceita somente canais `VOICE`. Entrar em outro canal encerra a presença anterior do usuário. O limite é de cinco participantes simultâneos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      responses:
        '200':
          description: Presença de mídia ativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Presença de mídia]
      operationId: listServerVoiceChannelMediaSessions
      summary: Lista os participantes de um canal de voz
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      responses:
        '200':
          description: Participantes ativos ou em reconexão
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Presença de mídia]
      operationId: leaveServerVoiceChannelMediaSession
      summary: Sai de um canal de voz do servidor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      responses:
        '204':
          description: Presença encerrada
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /servers/{serverId}/channels/{channelId}/media-sessions/me:
    patch:
      tags: [Presença de mídia]
      operationId: updateServerVoiceChannelMediaState
      summary: Atualiza microfone, câmera ou tela no canal de voz
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaStateRequest'
      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /servers/{serverId}/channels/{channelId}/messages:
    post:
      tags: [Mensagens]
      operationId: sendServerTextChannelMessage
      summary: Envia uma mensagem em um canal de texto
      description: Exige participação no servidor e rejeita canais de voz.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '201':
          description: Mensagem enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Mensagens]
      operationId: listServerTextChannelMessages
      summary: Lista as mensagens de um canal de texto
      description: Exige participação no servidor e rejeita canais de voz.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      responses:
        '200':
          description: Mensagens encontradas em ordem cronológica
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /servers/{serverId}/invites:
    post:
      tags: [Servidores]
      operationId: inviteFriendToServer
      summary: Convida um amigo para o servidor
      description: O remetente deve ser membro do servidor e o destinatário deve ser um amigo com amizade aceita. O convite não adiciona o destinatário até que ele o aceite.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerInviteRequest'
      responses:
        '201':
          description: Convite enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInvite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /servers/invites:
    get:
      tags: [Servidores]
      operationId: listPendingServerInvites
      summary: Lista os convites de servidor pendentes do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Convites pendentes encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerInvite'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /servers/invites/{inviteId}/accept:
    patch:
      tags: [Servidores]
      operationId: acceptServerInvite
      summary: Aceita um convite de servidor
      description: Somente o destinatário do convite pode aceitar. A confirmação cria seu vínculo como membro do servidor.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerInviteId'
      responses:
        '200':
          description: Convite aceito e usuário adicionado ao servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /ws:
    get:
      tags: [WebSocket]
      operationId: openWebSocket
      summary: Abre uma conexão WebSocket para STOMP
      description: |
        O handshake HTTP é público. Após o upgrade, o cliente deve enviar um frame STOMP `CONNECT`
        com o header nativo `Authorization: Bearer <JWT>`. Credenciais ausentes, inválidas ou
        expiradas encerram a conexão com um frame `ERROR`.

        Contrato autenticado atual:
        - `SEND` para `/app/direct-channels/{channelId}/messages` para uma mensagem privada;
        - `SEND` para `/app/servers/{serverId}/channels/{channelId}/messages` para uma mensagem de servidor;
        - ambos usam o corpo `MessageRequest`;
        - `SUBSCRIBE` em `/user/queue/messages` para receber `Message`;
        - `SUBSCRIBE` em `/user/queue/media-presence` para receber `MediaPresenceEvent`;
        - os demais destinos de envio e assinatura são rejeitados.

        O endpoint usa WebSocket nativo, sem SockJS. A autenticação não é enviada como header HTTP
        no handshake; ela é enviada no frame STOMP `CONNECT`.
      responses:
        '101':
          description: Protocolo atualizado para WebSocket.
          x-stomp-send-destinations:
            - /app/direct-channels/{channelId}/messages
            - /app/servers/{serverId}/channels/{channelId}/messages
          x-stomp-subscribe-destination: /user/queue/messages
          x-stomp-media-presence-subscribe-destination: /user/queue/media-presence
          x-stomp-send-schema:
            $ref: '#/components/schemas/MessageRequest'
          x-stomp-message-schema:
            $ref: '#/components/schemas/Message'
          x-stomp-media-presence-event-schema:
            $ref: '#/components/schemas/MediaPresenceEvent'
        '400':
          description: Handshake WebSocket inválido.
  /actuator/health:
    get:
      tags: [Monitoramento]
      operationId: getHealth
      summary: Verifica a saúde da aplicação
      description: Endpoint público do Spring Boot Actuator. Quando o banco está indisponível, responde 503.
      responses:
        '200':
          description: Aplicação e dependências disponíveis
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Uma dependência essencial está indisponível
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de acesso retornado por `/users/login` ou `/users/refresh`.
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: UUID da conta.
      schema:
        type: string
        format: uuid
    FriendshipId:
      name: id
      in: path
      required: true
      description: Identificador numérico da solicitação.
      schema:
        type: integer
        format: int64
    ServerId:
      name: serverId
      in: path
      required: true
      description: UUID do servidor.
      schema:
        type: string
        format: uuid
    ServerInviteId:
      name: inviteId
      in: path
      required: true
      description: Identificador numérico do convite de servidor.
      schema:
        type: integer
        format: int64
    DirectChannelId:
      name: channelId
      in: path
      required: true
      description: UUID do canal privado.
      schema:
        type: string
        format: uuid
    ServerChannelId:
      name: channelId
      in: path
      required: true
      description: UUID do canal pertencente ao servidor.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Requisição inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: JWT ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Usuário autenticado sem permissão para a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: O recurso já existe ou conflita com o estado atual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Erro interno da aplicação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UserRegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Ana Silva
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          format: password
          example: senha-segura
    UserLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          format: password
          example: senha-segura
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Token opaco retornado no login ou na última renovação.
          example: fQ9wVjW8P0Qm0xW6vYgR3nY9kF2uZcT8P4sL7aE1bN0
    AuthTokens:
      type: object
      required: [name, token, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        name:
          type: string
          example: Ana Silva
        token:
          type: string
          description: JWT de acesso.
          example: eyJhbGciOiJIUzI1NiJ9...
        expiresIn:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Token usado exclusivamente em `/users/refresh`.
        refreshExpiresIn:
          type: string
          format: date-time
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ana Silva
        email:
          type: string
          format: email
          example: ana@example.com
    FriendshipRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: string
          format: uuid
          description: UUID do usuário que receberá a solicitação.
    FriendshipRequestResponse:
      type: object
      required: [id, requesterName, requesterId]
      properties:
        id:
          type: integer
          format: int64
        requesterName:
          type: string
          example: Ana Silva
        requesterId:
          type: string
          format: uuid
    MessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          example: Olá!
    Message:
      type: object
      required: [id, channelId, content, authorId, authorName, createdAt]
      properties:
        id:
          type: integer
          format: int64
        channelId:
          type: string
          format: uuid
          description: UUID do canal que contém a mensagem.
        content:
          type: string
          example: Olá!
        authorId:
          type: string
          format: uuid
        authorName:
          type: string
          example: Ana Silva
        createdAt:
          type: string
          format: date-time
          description: Instante UTC em que a mensagem foi persistida.
    MediaStateRequest:
      type: object
      minProperties: 1
      properties:
        microphoneEnabled:
          type: boolean
          description: Microfone está transmitindo.
        cameraEnabled:
          type: boolean
          description: Câmera está transmitindo.
        screenShareEnabled:
          type: boolean
          description: Compartilhamento de tela ou janela está ativo.
    MediaSession:
      type: object
      required: [channelKind, channelId, userId, userName, status, microphoneEnabled, cameraEnabled, screenShareEnabled, joinedAt, lastSeenAt]
      properties:
        channelKind:
          type: string
          enum: [SERVER_VOICE, DIRECT]
        serverId:
          type: string
          format: uuid
          nullable: true
          description: UUID do servidor; ausente para chamadas privadas 1:1.
        channelId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userName:
          type: string
          example: Ana Silva
        status:
          type: string
          enum: [ACTIVE, RECONNECTING]
        microphoneEnabled:
          type: boolean
        cameraEnabled:
          type: boolean
        screenShareEnabled:
          type: boolean
        joinedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    MediaPresenceEvent:
      type: object
      required: [type, participant]
      properties:
        type:
          type: string
          enum: [media.participant.joined, media.participant.left, media.participant.updated]
        participant:
          $ref: '#/components/schemas/MediaSession'
    CreateDirectChannelRequest:
      type: object
      required: [participantId]
      properties:
        participantId:
          type: string
          format: uuid
          description: UUID do outro participante.
    DirectChannel:
      type: object
      required: [id, participantId, participantName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
          description: UUID do outro participante.
        participantName:
          type: string
          example: Ana Silva
        createdAt:
          type: string
          format: date-time
    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Equipe de produto
    Server:
      type: object
      required: [id, name, ownerId, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Equipe de produto
        ownerId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MEMBER]
        createdAt:
          type: string
          format: date-time
    CreateServerInviteRequest:
      type: object
      required: [friendId]
      properties:
        friendId:
          type: string
          format: uuid
          description: UUID de um amigo com amizade aceita que receberá o convite.
    ServerInvite:
      type: object
      required: [id, serverId, serverName, inviterId, inviterName, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
        serverName:
          type: string
          example: Equipe de produto
        inviterId:
          type: string
          format: uuid
        inviterName:
          type: string
          example: Ana Silva
        status:
          type: string
          enum: [PENDING, ACCEPTED]
        createdAt:
          type: string
          format: date-time
    CreateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: geral
        type:
          type: string
          enum: [TEXT, VOICE]
          example: TEXT
    ServerChannel:
      type: object
      required: [id, name, type, position, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: geral
        type:
          type: string
          enum: [TEXT, VOICE]
        position:
          type: integer
          minimum: 0
          example: 0
        createdAt:
          type: string
          format: date-time
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
          example: JWT ausente ou inválido
