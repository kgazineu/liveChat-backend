openapi: 3.0.3
info:
  title: LiveChat API
  version: 1.0.0
  description: >-
    API REST e contrato WebSocket/STOMP do LiveChat. Datas no formato
    date-time são representadas em UTC. Em respostas 429, o header `Retry-After`
    é exposto ao frontend pelo CORS da API. Anexos são enviados diretamente ao
    endpoint de upload do Cloudinary, sem atravessar o processo Java.
tags:
  - name: Usuários
    description: Cadastro, autenticação e gerenciamento da conta.
  - name: Amizades
    description: Solicitações e relacionamentos entre usuários.
  - name: Mensagens
    description: Histórico e entrega de mensagens de canais privados e de texto em servidores.
  - name: Anexos
    description: Reserva de uploads diretos de arquivos para mensagens.
  - name: Canais privados
    description: Conversas privadas entre exatamente dois usuários.
  - name: Servidores
    description: Servidores, membros, canais e convites entre amigos.
  - name: WebSocket
    description: Handshake e protocolo STOMP de mensagens em tempo real.
  - name: Presença de mídia
    description: Participação efêmera em chamadas de voz, câmera e compartilhamento de tela.
  - name: Monitoramento
    description: Estado de saúde da aplicação e dependências.
paths:
  /users/register:
    post:
      tags: [Usuários]
      operationId: registerUser
      summary: Cadastra um usuário
      description: >-
        Cria uma conta e armazena a senha com BCrypt. Não inicia uma sessão.
        Limitado a 5 tentativas por IP a cada hora.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '200':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/login:
    post:
      tags: [Usuários]
      operationId: loginUser
      summary: Autentica um usuário
      description: >-
        Retorna um JWT de acesso válido por duas horas e um refresh token válido por sete dias.
        Limitado a 10 tentativas por IP e 5 por conta a cada 5 minutos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Credenciais válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
  /users/refresh:
    post:
      tags: [Usuários]
      operationId: refreshUserTokens
      summary: Renova os tokens
      description: Consome o refresh token atual e devolve um novo par. O token consumido não pode ser reutilizado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/password-reset/request:
    post:
      tags: [Usuários]
      operationId: requestPasswordReset
      summary: Solicita recuperação de senha
      description: >-
        Quando admitida pelo limitador, sempre responde 202 para não revelar se o e-mail está
        cadastrado. Quando a conta existe, envia um link de uso único para o e-mail do usuário; o
        token expira em 15 minutos por padrão. Limitado a 3 solicitações por IP e 2 por e-mail a cada hora.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Solicitação recebida, independentemente da existência da conta.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
  /users/password-reset/confirm:
    post:
      tags: [Usuários]
      operationId: confirmPasswordReset
      summary: Define uma nova senha com o token recebido por e-mail
      description: >-
        Consome o token uma única vez, altera a senha e invalida os JWTs e refresh tokens emitidos
        anteriormente para a conta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Senha alterada e sessões anteriores invalidadas.
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/profile-update/confirm:
    post:
      tags: [Usuários]
      operationId: confirmProfileUpdate
      summary: Confirma uma atualização pendente do perfil
      description: >-
        Consome o token de uso único enviado ao e-mail anterior e aplica o novo nome e/ou e-mail.
        Quando o e-mail muda, JWTs e refresh tokens anteriores são invalidados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateConfirmRequest'
      responses:
        '204':
          description: Perfil atualizado.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /users:
    get:
      tags: [Usuários]
      operationId: listUsers
      summary: Lista os usuários cadastrados
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Usuários ativos encontrados; os itens não expõem e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}:
    delete:
      tags: [Usuários]
      operationId: deleteUser
      summary: Desativa e anonimiza a própria conta
      description: >-
        O identificador deve pertencer ao usuário autenticado. A conta é mantida como tombstone para
        preservar o histórico, mas perde acesso, dados pessoais, vínculos sociais e memberships. Os
        servidores são transferidos ao membro ativo mais antigo; servidores sem sucessor são removidos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Conta anonimizada, desativada e credenciais revogadas.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/search:
    get:
      tags: [Usuários]
      operationId: searchUsersByEmail
      summary: Busca um usuário por e-mail
      description: A implementação atual realiza correspondência exata de e-mail.
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: true
          description: E-mail completo do usuário procurado.
          schema:
            type: string
            format: email
          example: ana@example.com
      responses:
        '200':
          description: Lista vazia ou usuário encontrado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/password-reset:
    post:
      tags: [Usuários]
      operationId: requestAuthenticatedPasswordReset
      summary: Solicita troca de senha para a conta autenticada
      description: >-
        Envia ao e-mail atual o mesmo link usado na recuperação de senha. O cliente não informa o
        endereço; ele é obtido do usuário autenticado. A nova senha é definida em
        `/users/password-reset/confirm`. Limitado a 2 solicitações por usuário e por e-mail a cada hora.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Solicitação recebida.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
  /users/me:
    get:
      tags: [Usuários]
      operationId: getCurrentUser
      summary: Obtém o usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados privados da conta autenticada, incluindo o próprio e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Usuários]
      operationId: requestProfileUpdate
      summary: Solicita alteração do nome e/ou e-mail
      description: >-
        Não altera o perfil imediatamente. Cria uma solicitação de uso único e envia o link de
        confirmação ao e-mail atual, inclusive quando o endereço solicitado é diferente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '202':
          description: Atualização pendente criada e confirmação enviada ao e-mail atual.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /friendships/send:
    post:
      tags: [Amizades]
      operationId: sendFriendshipRequest
      summary: Envia uma solicitação de amizade
      description: >-
        Cria uma solicitação ou reabre um relacionamento rejeitado. A reabertura exige um cooldown
        de 24 horas desde a solicitação rejeitada. Limitado a 10 tentativas por remetente a cada hora
        e a 20 por destinatário a cada dia.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendshipRequest'
      responses:
        '200':
          description: Solicitação enviada ou relacionamento rejeitado reaberto
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
  /friendships/{id}/accept:
    patch:
      tags: [Amizades]
      operationId: acceptFriendshipRequest
      summary: Aceita uma solicitação de amizade
      description: Somente o destinatário pode aceitar a solicitação.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FriendshipId'
      responses:
        '204':
          description: Solicitação aceita
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /friendships/{id}/reject:
    patch:
      tags: [Amizades]
      operationId: rejectFriendshipRequest
      summary: Rejeita uma solicitação de amizade
      description: Somente o destinatário pode rejeitar a solicitação.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FriendshipId'
      responses:
        '204':
          description: Solicitação rejeitada
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /friendships:
    get:
      tags: [Amizades]
      operationId: listFriends
      summary: Lista os amigos do usuário autenticado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Amigos encontrados; os itens não expõem e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /friendships/requests:
    get:
      tags: [Amizades]
      operationId: listPendingFriendshipRequests
      summary: Lista solicitações de amizade pendentes
      description: Retorna solicitações recebidas pelo usuário autenticado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Solicitações pendentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendshipRequestPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /direct-channels:
    post:
      tags: [Canais privados]
      operationId: createOrGetDirectChannel
      summary: Cria ou recupera um canal privado 1:1
      description: >-
        Há no máximo um canal para cada par de usuários, independentemente de qual deles inicia a
        conversa. Criar um canal novo exige amizade aceita; se o canal já existir, ele continua
        acessível aos participantes mesmo que a amizade não esteja mais aceita.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectChannelRequest'
      responses:
        '201':
          description: Canal privado criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectChannel'
        '200':
          description: Canal privado já existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Canais privados]
      operationId: listDirectChannels
      summary: Lista os canais privados do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Canais privados encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /direct-channels/{channelId}:
    get:
      tags: [Canais privados]
      operationId: getDirectChannel
      summary: Consulta um canal privado
      description: Somente os dois participantes podem consultá-lo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      responses:
        '200':
          description: Canal privado encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /direct-channels/{channelId}/attachments/uploads:
    post:
      tags: [Anexos]
      operationId: reserveDirectChannelAttachmentUpload
      summary: Reserva o upload de um anexo para um canal privado
      description: >-
        Exige que o usuário seja participante do canal. Cria uma reserva pendente por 15 minutos por
        padrão e retorna autorização assinada para um `POST multipart/form-data` direto no Cloudinary;
        o arquivo não atravessa a API Java. O cliente deve adicionar todos os `formFields` ao `FormData`,
        adicionar o arquivo no campo `file` e, após concluir o upload, incluir o `attachmentId` em
        `attachmentIds` ao enviar a mensagem. A assinatura do Cloudinary é válida por até uma hora.
        Esta operação possui limite separado de 20 reservas por hora e burst de 8 por minuto, por usuário.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
      responses:
        '201':
          description: Upload reservado; a assinatura e os campos do formulário são temporários.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/AttachmentServiceUnavailable'
  /direct-channels/{channelId}/media-sessions:
    post:
      tags: [Presença de mídia]
      operationId: joinDirectChannelMediaSession
      summary: Entra na chamada privada 1:1
      description: Somente os participantes do canal podem entrar. Entrar encerra qualquer presença de mídia anterior do usuário.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      responses:
        '200':
          description: Presença de mídia ativa e credencial de entrada no LiveKit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSessionJoinResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Presença de mídia]
      operationId: listDirectChannelMediaSessions
      summary: Lista os participantes da chamada privada 1:1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      responses:
        '200':
          description: Participantes ativos ou em reconexão
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Presença de mídia]
      operationId: leaveDirectChannelMediaSession
      summary: Sai da chamada privada 1:1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      responses:
        '204':
          description: Presença encerrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /direct-channels/{channelId}/media-sessions/me:
    patch:
      tags: [Presença de mídia]
      operationId: updateDirectChannelMediaState
      summary: Atualiza microfone, câmera ou tela na chamada privada
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaStateRequest'
      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /direct-channels/{channelId}/messages:
    post:
      tags: [Mensagens]
      operationId: sendDirectChannelMessage
      summary: Envia uma mensagem em um canal privado
      description: >-
        Somente um dos dois participantes do canal pode enviar mensagens. A requisição deve conter
        texto não vazio, de um a quatro `attachmentIds` únicos, ou ambos. Para cada anexo, o backend
        consulta o asset privado no Cloudinary, valida tamanho, formato, proprietário, upload e canal
        reservados e associa todos os anexos à mensagem na mesma transação. O limite compartilhado entre
        envios privados e de servidor é de 60 mensagens por minuto, com burst de 10 a cada 5 segundos,
        por usuário.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '201':
          description: Mensagem enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/AttachmentServiceUnavailable'
    get:
      tags: [Mensagens]
      operationId: listDirectChannelMessages
      summary: Lista as mensagens de um canal privado
      description: Somente os dois participantes do canal podem consultar o histórico. Retorna as mensagens mais recentes primeiro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DirectChannelId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Mensagens encontradas, da mais recente para a mais antiga.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AttachmentServiceUnavailable'
  /servers:
    post:
      tags: [Servidores]
      operationId: createServer
      summary: Cria um servidor
      description: O usuário autenticado se torna proprietário e primeiro membro do servidor.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Servidor criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Servidores]
      operationId: listServers
      summary: Lista os servidores do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Servidores encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /servers/{serverId}:
    get:
      tags: [Servidores]
      operationId: getServer
      summary: Consulta um servidor
      description: Exige que o usuário autenticado seja membro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200':
          description: Servidor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /servers/{serverId}/members:
    get:
      tags: [Servidores]
      operationId: listServerMembers
      summary: Lista todos os membros de um servidor
      description: Exige que o usuário autenticado também seja membro. A lista é ordenada pelo instante de entrada.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Membros encontrados sem exposição de e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMemberPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /servers/{serverId}/channels:
    post:
      tags: [Servidores]
      operationId: createServerChannel
      summary: Cria um canal de texto ou voz
      description: Somente o proprietário do servidor pode criar canais.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Canal criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Servidores]
      operationId: listServerChannels
      summary: Lista os canais de um servidor
      description: Exige que o usuário autenticado seja membro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Canais encontrados, ordenados pela posição de criação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerChannelPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /servers/{serverId}/channels/{channelId}/attachments/uploads:
    post:
      tags: [Anexos]
      operationId: reserveServerChannelAttachmentUpload
      summary: Reserva o upload de um anexo para um canal de texto
      description: >-
        Exige participação no servidor e aceita somente um canal `TEXT` pertencente ao servidor.
        Cria uma reserva pendente por 15 minutos por padrão e retorna autorização assinada para um
        `POST multipart/form-data` direto no Cloudinary; o arquivo não atravessa a API Java. O cliente
        deve adicionar todos os `formFields` ao `FormData`, adicionar o arquivo no campo `file` e, após
        concluir o upload, incluir o `attachmentId` em `attachmentIds` ao enviar a mensagem. A assinatura
        do Cloudinary é válida por até uma hora. Esta operação possui limite separado de 20 reservas por
        hora e burst de 8 por minuto, por usuário.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
      responses:
        '201':
          description: Upload reservado; a assinatura e os campos do formulário são temporários.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/AttachmentServiceUnavailable'
  /servers/{serverId}/channels/{channelId}/media-sessions:
    post:
      tags: [Presença de mídia]
      operationId: joinServerVoiceChannelMediaSession
      summary: Entra em um canal de voz do servidor
      description: Exige participação no servidor e aceita somente canais `VOICE`. Entrar em outro canal encerra a presença anterior do usuário. O limite é de cinco participantes simultâneos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      responses:
        '200':
          description: Presença de mídia ativa e credencial de entrada no LiveKit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSessionJoinResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Presença de mídia]
      operationId: listServerVoiceChannelMediaSessions
      summary: Lista os participantes de um canal de voz
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      responses:
        '200':
          description: Participantes ativos ou em reconexão
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Presença de mídia]
      operationId: leaveServerVoiceChannelMediaSession
      summary: Sai de um canal de voz do servidor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      responses:
        '204':
          description: Presença encerrada
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /servers/{serverId}/channels/{channelId}/media-sessions/me:
    patch:
      tags: [Presença de mídia]
      operationId: updateServerVoiceChannelMediaState
      summary: Atualiza microfone, câmera ou tela no canal de voz
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaStateRequest'
      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /servers/{serverId}/channels/{channelId}/messages:
    post:
      tags: [Mensagens]
      operationId: sendServerTextChannelMessage
      summary: Envia uma mensagem em um canal de texto
      description: >-
        Exige participação no servidor e rejeita canais de voz. A requisição deve conter texto não
        vazio, de um a quatro `attachmentIds` únicos, ou ambos. Para cada anexo, o backend consulta o
        asset privado no Cloudinary, valida tamanho, formato, proprietário, upload e canal reservados e
        associa todos os anexos à mensagem na mesma transação. O limite compartilhado entre envios
        privados e de servidor é de 60 mensagens por minuto, com burst de 10 a cada 5 segundos, por usuário.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '201':
          description: Mensagem enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/AttachmentServiceUnavailable'
    get:
      tags: [Mensagens]
      operationId: listServerTextChannelMessages
      summary: Lista as mensagens de um canal de texto
      description: Exige participação no servidor, rejeita canais de voz e retorna as mensagens mais recentes primeiro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ServerChannelId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Mensagens encontradas, da mais recente para a mais antiga.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AttachmentServiceUnavailable'
  /servers/{serverId}/invites:
    post:
      tags: [Servidores]
      operationId: inviteFriendToServer
      summary: Convida um amigo para o servidor
      description: O remetente deve ser membro do servidor e o destinatário deve ser um amigo com amizade aceita. O convite não adiciona o destinatário até que ele o aceite.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerInviteRequest'
      responses:
        '201':
          description: Convite enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInvite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /servers/invites:
    get:
      tags: [Servidores]
      operationId: listPendingServerInvites
      summary: Lista os convites de servidor pendentes do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Convites pendentes encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerInvite'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /servers/invites/{inviteId}/accept:
    patch:
      tags: [Servidores]
      operationId: acceptServerInvite
      summary: Aceita um convite de servidor
      description: Somente o destinatário do convite pode aceitar. A confirmação cria seu vínculo como membro do servidor.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerInviteId'
      responses:
        '200':
          description: Convite aceito e usuário adicionado ao servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /ws:
    get:
      tags: [WebSocket]
      operationId: openWebSocket
      summary: Abre uma conexão WebSocket para STOMP
      description: |
        O handshake HTTP é público. Após o upgrade, o cliente deve enviar um frame STOMP `CONNECT`
        com o header nativo `Authorization: Bearer <JWT>`. Credenciais ausentes, inválidas ou
        expiradas encerram a conexão com um frame `ERROR`.

        Contrato autenticado atual:
        - `SEND` para `/app/direct-channels/{channelId}/messages` para uma mensagem privada;
        - `SEND` para `/app/servers/{serverId}/channels/{channelId}/messages` para uma mensagem de servidor;
        - ambos usam o corpo `MessageRequest`;
        - `SUBSCRIBE` em `/user/queue/messages` para receber `Message`;
        - `SUBSCRIBE` em `/user/queue/media-presence` para receber `MediaPresenceEvent`;
        - `SUBSCRIBE` em `/user/queue/friendships` para receber `FriendshipEvent`;
        - `SUBSCRIBE` em `/user/queue/server-invites` para receber `ServerInviteEvent`;
        - `SUBSCRIBE` em `/user/queue/server-members` para receber `ServerMemberEvent`;
        - os demais destinos de envio e assinatura são rejeitados.

        Os eventos são privados e efêmeros: o cliente deve assinar as filas antes de buscar os snapshots
        REST e repetir as consultas após uma reconexão. O endpoint usa WebSocket nativo, sem SockJS.
        A autenticação não é enviada como header HTTP no handshake; ela é enviada no frame STOMP
        `CONNECT`. Um JWT emitido antes de uma recuperação de senha também é rejeitado.
      responses:
        '101':
          description: Protocolo atualizado para WebSocket.
          x-stomp-send-destinations:
            - /app/direct-channels/{channelId}/messages
            - /app/servers/{serverId}/channels/{channelId}/messages
          x-stomp-subscribe-destination: /user/queue/messages
          x-stomp-media-presence-subscribe-destination: /user/queue/media-presence
          x-stomp-friendships-subscribe-destination: /user/queue/friendships
          x-stomp-server-invites-subscribe-destination: /user/queue/server-invites
          x-stomp-server-members-subscribe-destination: /user/queue/server-members
          x-stomp-send-schema:
            $ref: '#/components/schemas/MessageRequest'
          x-stomp-message-schema:
            $ref: '#/components/schemas/Message'
          x-stomp-media-presence-event-schema:
            $ref: '#/components/schemas/MediaPresenceEvent'
          x-stomp-friendship-event-schema:
            $ref: '#/components/schemas/FriendshipEvent'
          x-stomp-server-invite-event-schema:
            $ref: '#/components/schemas/ServerInviteEvent'
          x-stomp-server-member-event-schema:
            $ref: '#/components/schemas/ServerMemberEvent'
        '400':
          description: Handshake WebSocket inválido.
  /actuator/health:
    get:
      tags: [Monitoramento]
      operationId: getHealth
      summary: Verifica a saúde da aplicação
      description: Endpoint público do Spring Boot Actuator. Quando o banco está indisponível, responde 503.
      responses:
        '200':
          description: Aplicação e dependências disponíveis
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Uma dependência essencial está indisponível
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de acesso retornado por `/users/login` ou `/users/refresh`.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Índice da página, iniciado em zero.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Quantidade de itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: id
      in: path
      required: true
      description: UUID da conta.
      schema:
        type: string
        format: uuid
    FriendshipId:
      name: id
      in: path
      required: true
      description: Identificador numérico da solicitação.
      schema:
        type: integer
        format: int64
    ServerId:
      name: serverId
      in: path
      required: true
      description: UUID do servidor.
      schema:
        type: string
        format: uuid
    ServerInviteId:
      name: inviteId
      in: path
      required: true
      description: Identificador numérico do convite de servidor.
      schema:
        type: integer
        format: int64
    DirectChannelId:
      name: channelId
      in: path
      required: true
      description: UUID do canal privado.
      schema:
        type: string
        format: uuid
    ServerChannelId:
      name: channelId
      in: path
      required: true
      description: UUID do canal pertencente ao servidor.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Requisição inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: JWT ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Usuário autenticado sem permissão para a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: O recurso já existe ou conflita com o estado atual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Erro interno da aplicação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: LiveKit indisponível para criar a sala, emitir a credencial ou desconectar o participante.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Limite de requisições excedido.
      headers:
        Retry-After:
          description: >-
            Segundos inteiros até uma nova tentativa ser permitida; este header é exposto ao
            frontend pelo CORS da API.
          schema:
            type: integer
            format: int64
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimitUnavailable:
      description: Serviço de rate limiting indisponível; a operação falha de forma fechada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AttachmentServiceUnavailable:
      description: >-
        Cloudinary ou serviço de rate limiting indisponível. Reservas e envios falham de forma
        fechada; históricos podem falhar se não for possível assinar as URLs de download.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UserRegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Ana Silva
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          format: password
          example: senha-segura
    UserLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          format: password
          example: senha-segura
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Token opaco retornado no login ou na última renovação.
          example: fQ9wVjW8P0Qm0xW6vYgR3nY9kF2uZcT8P4sL7aE1bN0
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: ana@example.com
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: Token opaco de uso único recebido no link enviado por e-mail.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: nova-senha-segura
    ProfileUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Novo nome exibido, normalizado com remoção de espaços nas extremidades.
          example: Ana Silva
        email:
          type: string
          format: email
          maxLength: 254
          description: Novo e-mail, normalizado para minúsculas.
          example: ana.nova@example.com
    ProfileUpdateConfirmRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: Token opaco de uso único enviado ao e-mail anterior.
    AuthTokens:
      type: object
      required: [name, token, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        name:
          type: string
          example: Ana Silva
        token:
          type: string
          description: JWT de acesso.
          example: eyJhbGciOiJIUzI1NiJ9...
        expiresIn:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Token usado exclusivamente em `/users/refresh`.
        refreshExpiresIn:
          type: string
          format: date-time
    User:
      type: object
      description: Dados públicos de um usuário; não contém e-mail.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ana Silva
    CurrentUser:
      type: object
      description: Dados privados disponíveis somente para a própria conta em `/users/me`.
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ana Silva
        email:
          type: string
          format: email
          example: ana@example.com
    PageResponseDTO:
      type: object
      description: Envelope paginado retornado pela API; os schemas especializados tipam os itens de `content`.
      required: [content, page, size, totalElements, totalPages, last]
      properties:
        content:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 42
        totalPages:
          type: integer
          minimum: 0
          example: 3
        last:
          type: boolean
          example: false
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageResponseDTO'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/User'
    FriendshipRequestPage:
      allOf:
        - $ref: '#/components/schemas/PageResponseDTO'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/FriendshipRequestResponse'
    ServerMemberPage:
      allOf:
        - $ref: '#/components/schemas/PageResponseDTO'
        - type: object
          required: [content]
