name: Backend

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configurar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e testar
        run: ./mvnw --batch-mode --no-transfer-progress verify

  publish:
    name: Publicar imagem
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kgazineu/livechat-backend:${{ github.sha }}
            ghcr.io/kgazineu/livechat-backend:latest

  deploy:
    name: Deploy no homelab
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - publish
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 10

    steps:
      - name: Baixar configuração de deploy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Atualizar backend
        run: |
          install -m 0644 compose.prod.yaml /opt/livechat-back/compose.prod.yaml
          cd /opt/livechat-back
          docker compose -f compose.prod.yaml pull app
          docker compose -f compose.prod.yaml up -d --remove-orphans --wait --wait-timeout 180
          docker compose -f compose.prod.yaml ps
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/actuator/health
