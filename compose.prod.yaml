name: livechat-back

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-livechat}
      POSTGRES_USER: ${POSTGRES_USER_NAME:-livechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASS_WORD:?defina POSTGRES_PASS_WORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/kgazineu/livechat-backend:${APP_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_NAME:-livechat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_NAME:-livechat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASS_WORD:?defina POSTGRES_PASS_WORD no arquivo .env}
      SPRING_DATA_REDIS_URL: ${REDIS_URL:?defina REDIS_URL no arquivo .env}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST no arquivo .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?defina SMTP_USERNAME no arquivo .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?defina SMTP_PASSWORD no arquivo .env}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM no arquivo .env}
      FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:?defina FRONTEND_PASSWORD_RESET_URL no arquivo .env}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-15m}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:?defina LIVEKIT_API_URL no arquivo .env}
      LIVEKIT_CLIENT_URL: ${LIVEKIT_CLIENT_URL:?defina LIVEKIT_CLIENT_URL no arquivo .env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no arquivo .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no arquivo .env}
      LIVEKIT_TOKEN_TTL: ${LIVEKIT_TOKEN_TTL:-5m}
      LIVEKIT_ROOM_EMPTY_TIMEOUT: ${LIVEKIT_ROOM_EMPTY_TIMEOUT:-5m}
      LIVEKIT_ROOM_PROVISIONING_ENABLED: ${LIVEKIT_ROOM_PROVISIONING_ENABLED:-true}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=10.0 -XX:MaxRAMPercentage=45.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8080/actuator/health | grep --quiet '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
