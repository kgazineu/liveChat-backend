name: livechat-back

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-livechat}
      POSTGRES_USER: ${POSTGRES_USER_NAME:-livechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASS_WORD:?defina POSTGRES_PASS_WORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/kgazineu/livechat-backend:${APP_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_NAME:-livechat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_NAME:-livechat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASS_WORD:?defina POSTGRES_PASS_WORD no arquivo .env}
      SPRING_DATA_REDIS_URL: ${REDIS_URL:?defina REDIS_URL no arquivo .env}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST no arquivo .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?defina SMTP_USERNAME no arquivo .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?defina SMTP_PASSWORD no arquivo .env}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-5000}
      SMTP_READ_TIMEOUT_MS: ${SMTP_READ_TIMEOUT_MS:-5000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-5000}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM no arquivo .env}
      FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:?defina FRONTEND_PASSWORD_RESET_URL no arquivo .env}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-15m}
      FRONTEND_PROFILE_UPDATE_URL: ${FRONTEND_PROFILE_UPDATE_URL:?defina FRONTEND_PROFILE_UPDATE_URL no arquivo .env}
      PROFILE_UPDATE_TOKEN_TTL: ${PROFILE_UPDATE_TOKEN_TTL:-15m}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LEGACY_DIRECT_MESSAGES_MIGRATION_ENABLED: ${LEGACY_DIRECT_MESSAGES_MIGRATION_ENABLED:-false}
      ATTACHMENTS_PENDING_TTL: ${ATTACHMENTS_PENDING_TTL:-15m}
      ATTACHMENTS_CLEANUP_INTERVAL: ${ATTACHMENTS_CLEANUP_INTERVAL:-60s}
      ATTACHMENTS_S3_INTERNAL_ENDPOINT: ${ATTACHMENTS_S3_INTERNAL_ENDPOINT:?defina ATTACHMENTS_S3_INTERNAL_ENDPOINT no arquivo .env}
      ATTACHMENTS_S3_PUBLIC_ENDPOINT: ${ATTACHMENTS_S3_PUBLIC_ENDPOINT:?defina ATTACHMENTS_S3_PUBLIC_ENDPOINT no arquivo .env}
      ATTACHMENTS_S3_REGION: ${ATTACHMENTS_S3_REGION:?defina ATTACHMENTS_S3_REGION no arquivo .env}
      ATTACHMENTS_S3_ACCESS_KEY: ${ATTACHMENTS_S3_ACCESS_KEY:?defina ATTACHMENTS_S3_ACCESS_KEY no arquivo .env}
      ATTACHMENTS_S3_SECRET_KEY: ${ATTACHMENTS_S3_SECRET_KEY:?defina ATTACHMENTS_S3_SECRET_KEY no arquivo .env}
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET:?defina ATTACHMENTS_S3_BUCKET no arquivo .env}
      ATTACHMENTS_S3_PATH_STYLE: ${ATTACHMENTS_S3_PATH_STYLE:-true}
      ATTACHMENTS_UPLOAD_URL_TTL: ${ATTACHMENTS_UPLOAD_URL_TTL:-5m}
      ATTACHMENTS_DOWNLOAD_URL_TTL: ${ATTACHMENTS_DOWNLOAD_URL_TTL:-5m}
      TOMCAT_THREADS_MAX: ${TOMCAT_THREADS_MAX:-100}
      TOMCAT_MAX_CONNECTIONS: ${TOMCAT_MAX_CONNECTIONS:-1000}
      TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-100}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:?defina LIVEKIT_API_URL no arquivo .env}
      LIVEKIT_CLIENT_URL: ${LIVEKIT_CLIENT_URL:?defina LIVEKIT_CLIENT_URL no arquivo .env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no arquivo .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no arquivo .env}
      LIVEKIT_TOKEN_TTL: ${LIVEKIT_TOKEN_TTL:-5m}
      LIVEKIT_ROOM_EMPTY_TIMEOUT: ${LIVEKIT_ROOM_EMPTY_TIMEOUT:-5m}
      LIVEKIT_ROOM_PROVISIONING_ENABLED: ${LIVEKIT_ROOM_PROVISIONING_ENABLED:-true}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=10.0 -XX:MaxRAMPercentage=45.0
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8080/actuator/health | grep --quiet '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
