name: livechat-back

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-livechat}
      POSTGRES_USER: ${POSTGRES_USER_NAME:-livechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASS_WORD:?defina POSTGRES_PASS_WORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/kgazineu/livechat-backend:${APP_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_NAME:-livechat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_NAME:-livechat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASS_WORD:?defina POSTGRES_PASS_WORD no arquivo .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=10.0 -XX:MaxRAMPercentage=45.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8080/actuator/health | grep --quiet '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
